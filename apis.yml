name: Base Ai
description: >-
  Base is an AI Engagement OS for customer-led growth (CLG). The platform unifies advocacy,
  references, referrals, reviews, community, customer success, lifecycle engagement, and revenue
  attribution for B2B post-sale teams. Built for customer marketing, customer success, and RevOps
  teams, Base uses 100+ AI agents to automate onboarding, adoption, upsell/expansion, retention, and
  advocacy across the entire post-sale customer lifecycle, and to turn customer signals and feedback
  into references, testimonials, and expansion plays. Base integrates with Salesforce, HubSpot,
  Gainsight, Slack, Discord, Airtable, and Zendesk, and is backed by Wing Venture Capital. Base
  operates a token-authenticated REST API for its customers — tokens are generated inside the
  application under Settings > Users & Team — but publishes no public API reference, developer
  portal, OpenAPI definition, or SDKs, so the API surface is documented only by third-party
  integration platforms.
